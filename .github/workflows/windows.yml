name: Windows P0
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and verify native dependencies
        shell: pwsh
        run: ./scripts/bootstrap-native.ps1
      - name: Clean build and checks
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Launch real Compose window and capture evidence
        shell: pwsh
        run: ./scripts/build.ps1 -Tasks ':pinwheel-app:p0Smoke'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-evidence
          path: |
            **/build/reports/tests/
            evidence/p0/runtime/
