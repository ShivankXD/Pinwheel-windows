name: Windows P2
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and verify native dependencies
        shell: pwsh
        run: ./scripts/bootstrap-native.ps1
      - name: Clean build and checks
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Verify pinned desktop source and asset hashes
        shell: pwsh
        run: python scripts/verify-p1-port.py --desktop-only
      - name: Compile catalog shaders and render all P2 frames
        shell: pwsh
        run: ./scripts/build.ps1 -Tasks ':pinwheel-render:p2Frames'
      - name: Verify debug entitlement controls
        shell: pwsh
        run: ./scripts/build.ps1 -Tasks ':pinwheel-app:check','-Ppinwheel.debug=true'
      - name: Launch real Compose window and capture evidence
        shell: pwsh
        run: ./scripts/build.ps1 -Tasks ':pinwheel-app:p0Smoke'
      - name: Verify app failure exits with a nonzero code
        shell: pwsh
        run: ./scripts/check-smoke-failure.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-evidence
          path: |
            **/build/reports/tests/
            evidence/p0/runtime/
            evidence/p1/runtime/
            evidence/p2/
