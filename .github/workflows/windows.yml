name: Windows P3
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and verify native dependencies
        shell: pwsh
        run: ./scripts/bootstrap-native.ps1
      - name: Clean build and checks
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Verify pinned desktop source and asset hashes
        shell: pwsh
        run: |
          python scripts/verify-p1-port.py --desktop-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify-p2-port.py --desktop-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify-p3-port.py --desktop-only
      - name: Compile catalog shaders and render P2 frames and numeric probes
        shell: pwsh
        run: ./scripts/build.ps1 -Tasks ':pinwheel-render:p2Frames',':pinwheel-render:p2NoiseSources',':pinwheel-render:p2NumericProbe'
      - name: Verify noise classes from unchanged active shaders
        shell: pwsh
        run: python scripts/classify-p2-noise.py --check
      - name: Verify debug entitlement controls
        shell: pwsh
        run: ./scripts/build.ps1 -Tasks ':pinwheel-app:check','-Ppinwheel.debug=true'
      - name: Launch real Compose window and capture evidence
        shell: pwsh
        run: ./scripts/build.ps1 -Tasks ':pinwheel-app:p0Smoke'
      - name: Verify app failure exits with a nonzero code
        shell: pwsh
        run: ./scripts/check-smoke-failure.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-evidence
          path: |
            **/build/reports/tests/
            evidence/p0/runtime/
            evidence/p1/runtime/
            evidence/p2/
            evidence/p3/
